    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050408;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
        }

        #experience-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }

        /* Handwritten Message Overlay */
        #message-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            padding: 1.5rem;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .message-box {
            max-width: 680px;
            width: 100%;
            background: rgba(10, 8, 16, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 180, 0, 0.08);
            color: #fff1d6;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            line-height: 1.8;
            letter-spacing: 0.5px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .message-box::-webkit-scrollbar {
            display: none;
        }

        @media (max-width: 640px) {
            .message-box {
                padding: 1.5rem 1.25rem;
                font-size: 1.25rem;
                line-height: 1.65;
            }
        }

        .typing-cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background-color: #ffd700;
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Epilogue Text Overlay */
        #epilogue-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
            background: rgba(5, 4, 8, 0.95);
        }

        .epilogue-text {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            letter-spacing: 4px;
            color: #ffe6a7;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            text-align: center;
            padding: 0 1rem;
        }

        .replay-hint {
            margin-top: 2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }

        /* Developer Debug Controls Overlay */
        #debug-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 999;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #ffd700;
            border-radius: 8px;
            padding: 10px 14px;
            font-family: monospace;
            font-size: 11px;
            color: #ffd700;
            display: none;
            max-width: 280px;
        }

        .debug-btn {
            background: #222;
            border: 1px solid #555;
            color: #fff;
            padding: 3px 6px;
            margin: 2px;
            border-radius: 4px;

            font-size: 10px;
        }

        .debug-btn:hover {
            background: #ffd700;
            color: #000;
        }
    </style>
</head>
<body>

    <canvas id="experience-canvas"></canvas>

    <!-- Personal Message Text Overlay -->
    <div id="message-overlay">
        <div class="message-box">
            <span id="typed-text"></span><span id="cursor" class="typing-cursor"></span>
        </div>
    </div>

    <!-- Final Epilogue Screen -->
    <div id="epilogue-overlay">
        <div class="epilogue-text" id="epilogue-text">Happy 19th MAMAAA XY</div>
        <div class="replay-hint">From Jesster</div>
    </div>

    <!-- Developer Debug Overlay -->
    <div id="debug-panel">
        <div class="font-bold mb-1 border-b border-yellow-600 pb-1">DEBUG MODE (Press 'D' to Toggle)</div>
        <div>Scene: <span id="debug-scene-name" class="text-white">Opening</span> (<span id="debug-scene-num">1</span>/10)</div>
        <div>FPS: <span id="debug-fps" class="text-white">60</span> | Particles: <span id="debug-particles" class="text-white">0</span></div>
        <div>Audio: <span id="debug-audio" class="text-white">Stopped</span></div>
        <div class="mt-2 text-xs text-gray-300 mb-1">Jump to Scene:</div>
        <div class="flex flex-wrap gap-1">
            <button class="debug-btn" onclick="jumpToScene(1)">1:Heart</button>
            <button class="debug-btn" onclick="jumpToScene(2)">2:Explode</button>
            <button class="debug-btn" onclick="jumpToScene(3)">3:Cake</button>
            <button class="debug-btn" onclick="jumpToScene(4)">4:Candle</button>
            <button class="debug-btn" onclick="jumpToScene(5)">5:Melt</button>
            <button class="debug-btn" onclick="jumpToScene(6)">6:BigHeart</button>
            <button class="debug-btn" onclick="jumpToScene(7)">7:Letters</button>
            <button class="debug-btn" onclick="jumpToScene(8)">8:Friends</button>
            <button class="debug-btn" onclick="jumpToScene(9)">9:Message</button>
            <button class="debug-btn" onclick="jumpToScene(10)">10:Ending</button>
        </div>
    </div>

    <script>
        /**
         * CENTRAL CONFIGURATION OBJECT
         * Easily customize friend name, age, message, and audio settings here.
         */
        const CONFIG = {
            friendName: "Xy",
            age: 19,
            audioUrl: "", // Optional external MP3 URL. If empty, Web Audio API synthesizer generates gentle music box audio.
            musicLoop: true,
            debugMode: false, // Set true or press 'D' to open debug tools
            particleDensity: 1.0,
            message: "To XY,\n\nHappy 19th Birthday. There are probably a lot of things I could say to you today, but one thing has always stood out to me. You are one of those people who notices when someone is being left behind. You bring people together. You make sure everyone has a place. And somehow, even when our little circle gets chaotic, you are one of the people who keeps us moving together.\n\nMaybe you don't always realize how much that means to the people around you. But it does. So today isn't just about celebrating another year of your life. It's about celebrating the person you've become and the way you make the lives of the people around you a little better simply by being there.\n\nThank you for being the person who makes sure nobody gets left behind. Happy 19th Birthday, XY. I hope this year gives you the same kindness, happiness, and warmth that you've given to the people around you."
        };

        /**
         * WEB AUDIO SYNTHESIZER & SOUND EFFECTS ENGINE
         * Provides procedural audio, heartbeat sub-bass, thud impacts, ignition sweeps, handwriting scribbles, and Happy Birthday chime music box.
         */
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                this.musicPlaying = false;
                this.musicTimer = null;
                this.externalAudio = null;
                this.currentNoteIndex = 0;

                // Happy Birthday Melody Notes & Durations (in seconds)
                this.melody = [
                    { note: "G4", dur: 0.35 }, { note: "G4", dur: 0.15 }, { note: "A4", dur: 0.5 }, { note: "G4", dur: 0.5 }, { note: "C5", dur: 0.5 }, { note: "B4", dur: 0.9 },
                    { note: "G4", dur: 0.35 }, { note: "G4", dur: 0.15 }, { note: "A4", dur: 0.5 }, { note: "G4", dur: 0.5 }, { note: "D5", dur: 0.5 }, { note: "C5", dur: 0.9 },
                    { note: "G4", dur: 0.35 }, { note: "G4", dur: 0.15 }, { note: "G5", dur: 0.5 }, { note: "E5", dur: 0.5 }, { note: "C5", dur: 0.5 }, { note: "B4", dur: 0.5 }, { note: "A4", dur: 0.8 },
                    { note: "F5", dur: 0.35 }, { note: "F5", dur: 0.15 }, { note: "E5", dur: 0.5 }, { note: "C5", dur: 0.5 }, { note: "D5", dur: 0.5 }, { note: "C5", dur: 1.2 }
                ];

                this.frequencies = {
                    "G4": 392.00, "A4": 440.00, "B4": 493.88,
                    "C5": 523.25, "D5": 587.33, "E5": 659.25, "F5": 698.46, "G5": 783.99
                };
            }

            init() {
                if (this.ctx) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    this.ctx = new AudioCtx();
                }
            }

            // Low sub-bass heartbeat pulse
            playHeartbeat() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(65, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }

            // Shatter/Explosion noise burst
            playExplosion() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.8;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.8);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }

            // Heavy cake layer landing thud impact
            playCakeThud() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(25, this.ctx.currentTime + 0.4);

                gain.gain.setValueAtTime(0.7, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.45);
            }

            // Candle fire ignition swoosh
            playIgnition() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, this.ctx.currentTime + 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.5);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);
            }

            // Soft pen handwriting stroke sound
            playScribble() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800 + Math.random() * 400, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.015, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.06);
            }

            // Letter completion sparkling chime
            playChime(freq = 523.25) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.6);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.65);
            }

            startHappyBirthdayMusic() {
                if (this.musicPlaying) return;
                this.musicPlaying = true;
                this.currentNoteIndex = 0;

                if (CONFIG.audioUrl) {
                    this.externalAudio = new Audio(CONFIG.audioUrl);
                    this.externalAudio.loop = CONFIG.musicLoop;
                    this.externalAudio.play().catch(() => {
                        this.playNextMusicBoxNote();
                    });
                } else {
                    this.playNextMusicBoxNote();
                }
                
                const debugAudio = document.getElementById('debug-audio');
                if (debugAudio) debugAudio.innerText = "Playing (Loop)";
            }

            playNextMusicBoxNote() {
                if (!this.musicPlaying || !this.ctx) return;

                const noteData = this.melody[this.currentNoteIndex];
                const freq = this.frequencies[noteData.note] || 440;

                // Play soft chime note (Music Box timbre)
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc1.type = 'sine';
                osc2.type = 'triangle';

                osc1.frequency.setValueAtTime(freq, this.ctx.currentTime);
                osc2.frequency.setValueAtTime(freq * 2, this.ctx.currentTime); // Octave harmonic

                gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + noteData.dur * 1.5);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start();
                osc2.start();
                osc1.stop(this.ctx.currentTime + noteData.dur * 1.6);
                osc2.stop(this.ctx.currentTime + noteData.dur * 1.6);

                this.currentNoteIndex = (this.currentNoteIndex + 1) % this.melody.length;

                this.musicTimer = setTimeout(() => {
                    this.playNextMusicBoxNote();
                }, noteData.dur * 1000);
            }

            stopMusic() {
                this.musicPlaying = false;
                if (this.musicTimer) clearTimeout(this.musicTimer);
                if (this.externalAudio) {
                    this.externalAudio.pause();
                    this.externalAudio = null;
                }
                const debugAudio = document.getElementById('debug-audio');
                if (debugAudio) debugAudio.innerText = "Stopped";
            }
        }

        const audio = new AudioEngine();

        /**
         * CANVAS & PARTICLE ENGINE
         */
        const canvas = document.getElementById('experience-canvas');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        let dpr = Math.min(window.devicePixelRatio || 1, 2);

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Particle Class
        class Particle {
            constructor(x, y, color = '#ffd700', size = 2) {
                this.x = x;
                this.y = y;
                this.originX = x;
                this.originY = y;
                this.targetX = x;
                this.targetY = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.color = color;
                this.size = size;
                this.alpha = 1;
                this.friction = 0.95;
                this.ease = 0.05;
                this.life = 1.0;
            }

            update() {
                // Spring / Lerp towards target if set
                this.vx += (this.targetX - this.x) * this.ease;
                this.vy += (this.targetY - this.y) * this.ease;
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.x += this.vx;
                this.y += this.vy;
            }

            draw(c) {
                c.save();
                c.globalAlpha = Math.max(0, Math.min(1, this.alpha));
                c.fillStyle = this.color;
                c.beginPath();
                c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                c.fill();
                c.restore();
            }
        }

        /**
         * SCENE MANAGER & ENGINE STATE
         */
        const STATE = {
            scene: 1, // 1 through 10
            time: 0,
            sceneStartTime: 0,
            particles: [],
            ambientParticles: [],
            heartPulse: 0,
            cakeProgress: 0, // Cake fall layers
            candleLit: false,
            cameraShake: 0,
            calligraphyLetters: [],
            currentLetterIdx: 0,
            rearrangedTitle: false,
            friendHearts: [],
            typedMessageIndex: 0
        };

        // Initialize background ambient dust
        for (let i = 0; i < 70; i++) {
            STATE.ambientParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.5 + 0.2,
                speedY: -Math.random() * 0.3 - 0.1,
                speedX: (Math.random() - 0.5) * 0.2
            });
        }

        // Parametric Heart Point Generator
        function getHeartPoint(t, scale = 10) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * scale, y: y * scale };
        }

        // Text Sampling to Particle Coordinates Generator
        function getPixelPointsFromText(text, fontSize = 90) {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = 700;
            offCanvas.height = 300;
            const offCtx = offCanvas.getContext('2d');
            offCtx.font = `bold ${fontSize}px "Dancing Script", "Cinzel", sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillStyle = '#ffffff';
            offCtx.fillText(text, 350, 150);

            const imgData = offCtx.getImageData(0, 0, 700, 300);
            const points = [];
            const step = Math.max(3, Math.floor(6 / (CONFIG.particleDensity || 1)));

            for (let y = 0; y < 300; y += step) {
                for (let x = 0; x < 700; x += step) {
                    const alpha = imgData.data[(y * 700 + x) * 4 + 3];
                    if (alpha > 128) {
                        points.push({ x: x - 350, y: y - 150 });
                    }
                }
            }
            return points;
        }

        function switchScene(nextScene) {
            STATE.scene = nextScene;
            STATE.sceneStartTime = STATE.time;

            // Debug UI update
            const names = ["", "Opening", "Heart Explode", "Cake Assembly", "Candle Light", "Cake Dissolve", "Big Heart Xy", "Calligraphy Letters", "Friend Circle", "Typed Message", "Epilogue"];
            document.getElementById('debug-scene-name').innerText = names[nextScene] || "";
            document.getElementById('debug-scene-num').innerText = nextScene;

            // Clean overlay states
            document.getElementById('message-overlay').style.opacity = 0;
            document.getElementById('epilogue-overlay').style.opacity = 0;

            if (nextScene === 2) {
                // Heart explosion
                audio.playExplosion();
                STATE.particles = [];
                for (let i = 0; i < 450; i++) {
                    const p = new Particle(width / 2, height / 2, Math.random() > 0.3 ? '#ffd700' : '#ff4d6d', Math.random() * 3 + 1);
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 12 + 2;
                    p.vx = Math.cos(angle) * speed;
                    p.vy = Math.sin(angle) * speed;
                    p.friction = 0.96;
                    p.ease = 0;
                    STATE.particles.push(p);
                }
                setTimeout(() => switchScene(3), 2500);
            }
            else if (nextScene === 3) {
                // Cake Assembly setup
                STATE.particles = [];
                STATE.cakeProgress = 0;
            }
            else if (nextScene === 4) {
                // Candle reveal & ignition
                STATE.candleLit = false;
                setTimeout(() => {
                    STATE.candleLit = true;
                    audio.playIgnition();
                    // EXACT TIMING: Happy Birthday song loops starting right now!
                    audio.startHappyBirthdayMusic();
                    setTimeout(() => switchScene(5), 4500);
                }, 1500);
            }
            else if (nextScene === 5) {
                // Cake Dissolve into Particle Cosmos
                STATE.particles = [];
                const cakeY = height / 2 + 50;
                for (let i = 0; i < 600; i++) {
                    const p = new Particle(width / 2 + (Math.random() - 0.5) * 260, cakeY + (Math.random() - 0.5) * 160, Math.random() > 0.4 ? '#ffe6a7' : '#ff758f', Math.random() * 2.5 + 1);
                    p.targetX = width / 2 + (Math.random() - 0.5) * (width * 0.8);
                    p.targetY = height / 2 + (Math.random() - 0.5) * (height * 0.8);
                    p.ease = 0.02;
                    STATE.particles.push(p);
                }
                setTimeout(() => switchScene(6), 4000);
            }
            else if (nextScene === 6) {
                // Large Particle Heart with "Xy's 19th" inside
                STATE.particles = [];
                // Heart shape outline
                for (let t = 0; t < Math.PI * 2; t += 0.03) {
                    const pt = getHeartPoint(t, width < 600 ? 10 : 14);
                    const p = new Particle(width / 2 + (Math.random() - 0.5) * 200, height / 2 + (Math.random() - 0.5) * 200, '#ff4d6d', 2.5);
                    p.targetX = width / 2 + pt.x;
                    p.targetY = height / 2 + pt.y - 20;
                    p.ease = 0.04;
                    STATE.particles.push(p);
                }
                // Text inside heart
                const textPts = getPixelPointsFromText(`${CONFIG.friendName}'s ${CONFIG.age}th`, width < 600 ? 40 : 55);
                textPts.forEach(pt => {
                    const p = new Particle(width / 2, height / 2, '#ffd700', 2);
                    p.targetX = width / 2 + pt.x;
                    p.targetY = height / 2 + pt.y - 10;
                    p.ease = 0.05;
                    STATE.particles.push(p);
                });
                setTimeout(() => switchScene(7), 4500);
            }
            else if (nextScene === 7) {
                // Calligraphy letter spelling stream
                STATE.particles = [];
                STATE.currentLetterIdx = 0;
                STATE.rearrangedTitle = false;

                // Create individual letters string list
                const fullText = `HAPPY ${CONFIG.age}TH BIRTHDAY ${CONFIG.friendName.toUpperCase()}`;
                STATE.calligraphyLetters = fullText.split('');
                playNextCalligraphyLetter();
            }
            else if (nextScene === 8) {
                
                STATE.particles = [];
                STATE.friendHearts = [];
                const numFriends = 8;
                for (let i = 0; i < numFriends; i++) {
                    STATE.friendHearts.push({
                        x: width / 2 + (Math.random() - 0.5) * (width * 0.7),
                        y: height / 2 + (Math.random() - 0.5) * (height * 0.7),
                        targetX: width / 2 + Math.cos(i * (Math.PI * 2 / numFriends)) * 140,
                        targetY: height / 2 + Math.sin(i * (Math.PI * 2 / numFriends)) * 140,
                        isCentral: i === 0,
                        size: i === 0 ? 1.4 : 1.0,
                        label: i === 0 ? CONFIG.friendName : ""
                    });
                }
                setTimeout(() => switchScene(9), 7000);
            }
            else if (nextScene === 9) {
                
                STATE.particles = [];
                document.getElementById('message-overlay').style.opacity = 1;
                document.getElementById('typed-text').innerHTML = "";
                STATE.typedMessageIndex = 0;
                typeWriterEffect();
            }
            else if (nextScene === 10) {
                
                STATE.particles = [];
                document.getElementById('message-overlay').style.opacity = 0;

            
                for (let t = 0; t < Math.PI * 2; t += 0.04) {
                    const pt = getHeartPoint(t, 9);
                    const p = new Particle(width / 2 + (Math.random() - 0.5) * width, height + 100, '#ffe6a7', 2);
                    p.targetX = width / 2 + pt.x;
                    p.targetY = height / 2 + pt.y;
                    p.ease = 0.03;
                    STATE.particles.push(p);
                }

                setTimeout(() => {
                    document.getElementById('epilogue-overlay').style.opacity = 1;
                }, 4000);
            }
        }

        function playNextCalligraphyLetter() {
            if (STATE.scene !== 7) return;

            if (STATE.currentLetterIdx >= STATE.calligraphyLetters.length) {
                // All letters drawn -> Rearrange into complete centered particle header
                STATE.rearrangedTitle = true;
                STATE.particles = [];
                audio.playChime(659.25);

                const titleText = `HAPPY ${CONFIG.age}TH BIRTHDAY ${CONFIG.friendName.toUpperCase()}`;
                const pts = getPixelPointsFromText(titleText, width < 600 ? 32 : 52);
                pts.forEach(pt => {
                    const p = new Particle(width / 2 + (Math.random() - 0.5) * 100, height - 80, Math.random() > 0.3 ? '#ffd700' : '#ffffff', 2);
                    p.targetX = width / 2 + pt.x;
                    p.targetY = height / 2 + pt.y;
                    p.ease = 0.05;
                    STATE.particles.push(p);
                });

                setTimeout(() => switchScene(8), 5000);
                return;
            }

            const letter = STATE.calligraphyLetters[STATE.currentLetterIdx];

            if (letter === " ") {
                STATE.currentLetterIdx++;
                setTimeout(playNextCalligraphyLetter, 200);
                return;
            }

            // Stream out particles from small heart at bottom to spell single letter at center
            audio.playScribble();
            const letterPts = getPixelPointsFromText(letter, width < 600 ? 90 : 130);

            letterPts.forEach(pt => {
                const p = new Particle(width / 2, height - 70, '#ffd700', 2.5);
                p.targetX = width / 2 + pt.x;
                p.targetY = height / 2 + pt.y - 30;
                p.ease = 0.07;
                STATE.particles.push(p);
            });

            setTimeout(() => {
                audio.playChime(440 + (STATE.currentLetterIdx * 20));
                // Floating transition upward
                STATE.particles.forEach(p => {
                    p.targetY -= 80;
                    p.alpha = 0.4;
                });

                STATE.currentLetterIdx++;
                setTimeout(playNextCalligraphyLetter, 650);
            }, 600);
        }

        function typeWriterEffect() {
            if (STATE.scene !== 9) return;
            const fullMsg = CONFIG.message;
            if (STATE.typedMessageIndex < fullMsg.length) {
                const char = fullMsg.charAt(STATE.typedMessageIndex);
                if (char === '\n') {
                    document.getElementById('typed-text').innerHTML += '<br/>';
                } else {
                    document.getElementById('typed-text').innerHTML += char;
                }
                STATE.typedMessageIndex++;

                if (STATE.typedMessageIndex % 4 === 0) {
                    audio.playScribble();
                }

                // Autoscroll box as writing progresses
                const box = document.querySelector('.message-box');
                if (box) box.scrollTop = box.scrollHeight;

                setTimeout(typeWriterEffect, 42);
            } else {
                // Done writing message -> pause so visitor reads, then move to ending
                setTimeout(() => switchScene(10), 6500);
            }
        }

        function renderScene1(now) {
            const centerX = width / 2;
            const centerY = height / 2;

            STATE.heartPulse = Math.sin(now * 2.2) * 0.12 + 1.0;

            // Subtle Heartbeat Audio every ~1.5s
            if (Math.floor(now * 100) % 150 === 0) {
                audio.playHeartbeat();
            }

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(STATE.heartPulse, STATE.heartPulse);

            // Glowing Heart Path
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ff4d6d';
            ctx.fillStyle = '#ff2a54';
            ctx.beginPath();
            for (let t = 0; t < Math.PI * 2; t += 0.02) {
                const pt = getHeartPoint(t, width < 600 ? 1.1 : 1.5);
                if (t === 0) ctx.moveTo(pt.x, pt.y);
                else ctx.lineTo(pt.x, pt.y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function renderScene3(elapsed) {
            const centerX = width / 2;
            const cakeBaseY = height / 2 + 100;

            // Tier 1 (Bottom, widest)
            if (elapsed > 0.5 && STATE.cakeProgress < 1) {
                STATE.cakeProgress = 1;
                STATE.cameraShake = 12;
                audio.playCakeThud();
            }
            // Tier 2 (Middle)
            if (elapsed > 1.8 && STATE.cakeProgress < 2) {
                STATE.cakeProgress = 2;
                STATE.cameraShake = 10;
                audio.playCakeThud();
            }
            // Tier 3 (Top)
            if (elapsed > 3.0 && STATE.cakeProgress < 3) {
                STATE.cakeProgress = 3;
                STATE.cameraShake = 8;
                audio.playCakeThud();
                setTimeout(() => switchScene(4), 1800);
            }

            // Draw Cake Tiers
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(255, 215, 0, 0.3)';

            if (STATE.cakeProgress >= 1) {
                // Base Tier
                ctx.fillStyle = '#3a2010';
                ctx.beginPath();
                ctx.roundRect(centerX - 130, cakeBaseY - 50, 260, 50, 10);
                ctx.fill();
                ctx.fillStyle = '#ffe6a7'; // Frosting
                ctx.fillRect(centerX - 130, cakeBaseY - 50, 260, 12);
            }

            if (STATE.cakeProgress >= 2) {
                // Middle Tier
                ctx.fillStyle = '#4a2818';
                ctx.beginPath();
                ctx.roundRect(centerX - 95, cakeBaseY - 100, 190, 50, 8);
                ctx.fill();
                ctx.fillStyle = '#ff758f'; // Frosting
                ctx.fillRect(centerX - 95, cakeBaseY - 100, 190, 10);
            }

            if (STATE.cakeProgress >= 3) {
                // Top Tier
                ctx.fillStyle = '#5a3020';
                ctx.beginPath();
                ctx.roundRect(centerX - 60, cakeBaseY - 145, 120, 45, 6);
                ctx.fill();
                ctx.fillStyle = '#ffd700'; // Frosting
                ctx.fillRect(centerX - 60, cakeBaseY - 145, 120, 8);
            }

            ctx.restore();
        }

        function renderScene4() {
            const centerX = width / 2;
            const cakeBaseY = height / 2 + 100;
            const candleTopY = cakeBaseY - 185;

            // Draw Candle "19"
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px "Cinzel", serif';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffd700';
            ctx.fillText(`${CONFIG.age}`, centerX, cakeBaseY - 150);

            // Flame Ignition
            if (STATE.candleLit) {
                const flameScale = 1 + Math.sin(STATE.time * 15) * 0.15;
                ctx.translate(centerX, candleTopY);
                ctx.scale(flameScale, flameScale);

                // Flame glow background
                const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, 35);
                grad.addColorStop(0, 'rgba(255, 230, 100, 1)');
                grad.addColorStop(0.4, 'rgba(255, 120, 0, 0.8)');
                grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, 35, 0, Math.PI * 2);
                ctx.fill();

                // Core Flame
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(0, -2, 5, 12, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function renderScene8() {
            const centerX = width / 2;
            const centerY = height / 2;

            ctx.save();
            // Draw connecting constellation line beams
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            STATE.friendHearts.forEach((h, i) => {
                if (i === 0) ctx.moveTo(h.x, h.y);
                else ctx.lineTo(h.x, h.y);
            });
            ctx.closePath();
            ctx.stroke();

            // Draw friend node hearts
            STATE.friendHearts.forEach((h) => {
                // Lerp position towards target circle
                h.x += (h.targetX - h.x) * 0.03;
                h.y += (h.targetY - h.y) * 0.03;

                ctx.save();
                ctx.translate(h.x, h.y);
                ctx.scale(h.size, h.size);
                ctx.fillStyle = h.isCentral ? '#ffd700' : '#ff4d6d';
                ctx.shadowBlur = 12;
                ctx.shadowColor = ctx.fillStyle;

                ctx.beginPath();
                for (let t = 0; t < Math.PI * 2; t += 0.1) {
                    const pt = getHeartPoint(t, 0.5);
                    if (t === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                }
                ctx.fill();

                if (h.label) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '12px "Inter", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(h.label, 0, 22);
                }
                ctx.restore();
            });
            ctx.restore();
        }

        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 60;

        function animate(nowMs) {
            requestAnimationFrame(animate);

            const now = nowMs / 1000;
            const delta = now - lastTime;
            lastTime = now;
            STATE.time = now;

            // Calculate FPS for debug
            frameCount++;
            if (frameCount % 30 === 0) {
                fps = Math.round(1 / (delta || 0.016));
                const debugFps = document.getElementById('debug-fps');
                const debugParticles = document.getElementById('debug-particles');
                if (debugFps) debugFps.innerText = fps;
                if (debugParticles) debugParticles.innerText = STATE.particles.length;
            }

            // Clear Screen
            ctx.fillStyle = '#050408';
            ctx.fillRect(0, 0, width, height);

            // Apply Camera Shake if active
            ctx.save();
            if (STATE.cameraShake > 0) {
                ctx.translate((Math.random() - 0.5) * STATE.cameraShake, (Math.random() - 0.5) * STATE.cameraShake);
                STATE.cameraShake *= 0.88;
                if (STATE.cameraShake < 0.1) STATE.cameraShake = 0;
            }

            // Render background ambient floating dust
            STATE.ambientParticles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;
                if (p.y < 0) p.y = height;
                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;

                ctx.fillStyle = 'rgba(255, 230, 200, ' + p.alpha + ')';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Update & Render Particle System
            STATE.particles.forEach(p => {
                p.update();
                p.draw(ctx);
            });

            // Render Current Active Scene
            const sceneElapsed = now - STATE.sceneStartTime;

            if (STATE.scene === 1) {
                renderScene1(now);
            } else if (STATE.scene === 3) {
                renderScene3(sceneElapsed);
            } else if (STATE.scene === 4) {
                renderScene3(2.5); // Hold cake
                renderScene4();
            } else if (STATE.scene === 7) {
                // Render small compact heart at bottom center
                ctx.save();
                ctx.translate(width / 2, height - 70);
                ctx.fillStyle = '#ff4d6d';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff4d6d';
                ctx.beginPath();
                for (let t = 0; t < Math.PI * 2; t += 0.1) {
                    const pt = getHeartPoint(t, 0.6);
                    if (t === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                }
                ctx.fill();
                ctx.restore();
            } else if (STATE.scene === 8) {
                renderScene8();
            }

            ctx.restore();
        }

        // Global Click / Tap Event Handler
        function handleUserInteraction() {
            audio.init();

            if (STATE.scene === 1) {
                // Trigger Fullscreen on initial heart interaction
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
                switchScene(2);
            } else if (STATE.scene === 10) {
                // Replay experience
                switchScene(1);
            }
        }

        window.addEventListener('click', handleUserInteraction);
        window.addEventListener('touchstart', (e) => {
            handleUserInteraction();
        }, { passive: true });

        // Keyboard Debug Shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.key === 'd' || e.key === 'D') {
                CONFIG.debugMode = !CONFIG.debugMode;
                document.getElementById('debug-panel').style.display = CONFIG.debugMode ? 'block' : 'none';
            }
            if (CONFIG.debugMode && e.key >= '1' && e.key <= '9') {
                jumpToScene(parseInt(e.key));
            }
            if (CONFIG.debugMode && e.key === '0') {
                jumpToScene(10);
            }
        });

        function jumpToScene(num) {
            audio.init();
            switchScene(num);
        }

        // Initialize Debug Panel visibility based on CONFIG
        if (CONFIG.debugMode) {
            document.getElementById('debug-panel').style.display = 'block';
        }

        // Start Animation Engine loop on window load
        window.onload = function() {
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
